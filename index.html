<!DOCTYPE html>
<html lang="nl">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Queens Expert 7x7</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <script src="levels.js"></script>
