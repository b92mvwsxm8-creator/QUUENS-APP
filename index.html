<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Queens</title>

  <link rel="stylesheet" href="styles.css">
</head>
<body>

<header>
  <h1>Queens</h1>

  <div class="row">
    <label for="puzzleSelect">Puzzel</label>
    <select id="puzzleSelect"></select>

    <button id="resetBtn" type="button">Reset</button>
  </div>

  <p id="status"></p>
</header>

<main>
  <div id="board" class="board"></div>

  <section class="rules">
    <p>
      Plaats exact één koningin per rij, kolom en gekleurd gebied.
      Koninginnen mogen elkaar niet raken, ook niet diagonaal.
      Gebruik kruisjes om vakjes uit te sluiten.
    </p>
  </section>
</main>

<script src="puzzles.js"></script>
<script src="app.js"></script>

</body>
</html>
