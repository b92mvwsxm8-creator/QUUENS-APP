<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Queens LinkedIn Expert</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header><h1>Queens Expert</h1></header>

    <div class="controls">
        <select id="size-select" onchange="initGame()">
            <option value="7">Grid: 7x7</option>
            <option value="8" selected>Grid: 8x8</option>
            <option value="9">Grid: 9x9</option>
            <option value="10">Grid: 10x10</option>
        </select>

        <select id="difficulty" onchange="initGame()">
            <option value="easy">Niveau: Simpel</option>
            <option value="medium">Niveau: Gemiddeld</option>
            <option value="hard" selected>Niveau: Expert</option>
        </select>

        <button onclick="initGame()">Nieuwe Puzzel</button>
        
        <div class="timer-box">Tijd: <span id="timer">00:00</span></div>
        <div class="highscore-box">PR: <span id="best-time">--:--</span></div>
    </div>

    <div id="board-container">
        <div id="board"></div>
    </div>

    <div class="instructions">
        <h3>Hoe speel je Queens?</h3>
        <p>1. Eén kroon per rij, kolom en kleurvlak.</p>
        <p>2. Kronen mogen elkaar niet diagonaal raken.</p>
        <p>3. Gebruik ✕ om vakjes uit te sluiten.</p>
        <p><i>Tik 1x voor ✕, tik 2x voor een kroon.</i></p>
    </div>

    <script src="app.js"></script>
</body>
</html>
