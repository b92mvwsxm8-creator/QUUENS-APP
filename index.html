<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Queens Game</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <header>
        <h1>Queens</h1>
    </header>

    <div class="controls">
        <span>Tijd: <span id="timer">00:00</span></span>
        <button id="resetBtn" onclick="initGame(7)">Reset</button>
    </div>

    <div id="board"></div>

    <div class="instructions">
        <p>Plaats exact één koningin per rij, kolom en gekleurd gebied. Koninginnen mogen elkaar niet raken, ook niet diagonaal. Gebruik kruisjes om vakjes uit te sluiten.</p>
    </div>

    <script src="app.js"></script>
</body>
</html>
