<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Queens Expert</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header><h1>Queens Expert</h1></header>
    <div class="controls">
        <select id="gridSize" onchange="initGame()">
            <option value="7" selected>7x7</option>
            <option value="8">8x8</option>
            <option value="10">10x10</option>
        </select>
        <select id="difficulty" onchange="initGame()">
            <option value="easy">Simpel</option>
            <option value="hard" selected>Expert</option>
        </select>
        <button onclick="initGame()">Nieuwe Puzzel</button>
        <div class="timer-box">Tijd: <span id="timer">00:00</span></div>
        <div class="highscore-box">PR: <span id="best-time">--:--</span></div>
    </div>
    <div id="board-container"><div id="board"></div></div>
    <script src="puzzles.js"></script>
    <script src="app.js"></script>
</body>
</html>
