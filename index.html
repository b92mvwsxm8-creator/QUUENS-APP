<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Queens 7x7</title>
    <style>
        body { font-family: -apple-system, sans-serif; display: flex; justify-content: center; background-color: #f0f0f0; margin: 0; padding: 20px; }
        .game-container { width: 100%; max-width: 450px; }
        .status-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; padding: 10px; background: white; border-radius: 8px; }
        #timer { font-family: monospace; font-size: 18px; font-weight: bold; }
        #best-time { font-size: 11px; color: #888; }
        #grid {
            display: grid;
            gap: 1px;
            background-color: #333;
            width: 100%;
            aspect-ratio: 1 / 1;
            border: 2px solid #333;
        }
        .cell { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; cursor: pointer; user-select: none; }
        .queen { font-size: 34px; color: #000; }
        .cross { font-size: 14px; color: rgba(0,0,0,0.4); }
        .cell.error { background-color: #ff4d4d !important; }
        .controls { margin-top: 20px; display: flex; gap: 10px; justify-content: center; }
        button { padding: 12px 20px; border: none; border-radius: 8px; background: #333; color: white; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

<div class="game-container">
    <div class="status-bar">
        <div>
            <div id="level-indicator" style="font-weight: bold;">Level: --</div>
            <div id="best-time">Record: --:--</div>
        </div>
        <div id="timer">00:00</div>
    </div>
    <div id="grid"></div>
    <div class="controls">
        <button onclick="resetLevel()">Reset</button>
        <button onclick="nextLevel()">Volgend Level</button>
    </div>
</div>

<script>
// Levels direct in de variabele zonder losse kleur-variabelen erbuiten (voorkomt laad-fout)
const QUEENS_LEVELS = [
    { id: 102, colorRegions: [["A","A","A","A","A","B","B"],["A","C","A","A","A","B","B"],["A","C","C","C","C","C","C"],["A","C","E","E","D","D","D"],["A","C","E","G","D","F","F"],["A","A","E","G","D","G","F"],["A","A","E","G","G","G","F"]], regionColors: { A: "#DFA0BF", B: "#FFC992", C: "#96BEFF", D: "#B3DFA0", E: "#DFDFDF", F: "#FF7B60", G: "#E6F388" } },
    { id: 119, colorRegions: [["E","E","B","D","D","D","D"],["B","B","B","D","F","G","G"],["B","B","B","D","F","G","G"],["B","B","B","D","F","G","G"],["C","F","F","F","F","F","G"],["A","A","A","A","A","F","F"],["F","F","F","F","F","F","F"]], regionColors: { A: "#BBA3E2", B: "#FFC992", C: "#96BEFF", D: "#B3DFA0", E: "#DFDFDF", F: "#FF7B60", G: "#E6F388" } },
    { id: 148, colorRegions: [["F","F","F","F","F","D","D"],["F","F","E","F","D","D","D"],["F","F","E","E","D","G","G"],["B","B","B","E","D","G","G"],["B","A","B","E","G","G","G"],["C","A","E","E","G","G","G"],["C","A","A","A","G","G","G"]], regionColors: { A: "#BBA3E2", B: "#FFC992", C: "#96BEFF", D: "#B3DFA0", E: "#DFDFDF", F: "#FF7B60", G: "#E6F388" } }
    // ... meer levels kunnen hier op dezelfde manier
];

let currentLevelIndex = 0, boardState = [], startTime, timerInterval;

function init() {
    if (typeof QUEENS_LEVELS !== 'undefined' && QUEENS_LEVELS.length > 0) {
        loadLevel(0);
    }
}

function loadLevel(index) {
    const level = QUEENS_LEVELS[index];
    const size = 7;
    boardState = Array.from({ length: size }, () => Array(size).fill(0));
    
    document.getElementById('level-indicator').innerText = `Level: ${level.id}`;
    
    // Record weergave veilig maken
    const scores = JSON.parse(localStorage.getItem('q_best_7x7') || '{}');
    const best = scores[level.id];
    document.getElementById('best-time').innerText = best ? `Record: ${Math.floor(best/60).toString().padStart(2,'0')}:${(best%60).toString().padStart(2,'0')}` : "Record: --:--";

    const grid = document.getElementById('grid');
    grid.innerHTML = '';
    grid.style.gridTemplateColumns = `repeat(${size}, 1fr)`;

    for (let r = 0; r < size; r++) {
        for (let c = 0; c < size; c++) {
            const cell = document.createElement('div');
            cell.className = 'cell';
            cell.id = `cell-${r}-${c}`;
            cell.style.backgroundColor = level.regionColors[level.colorRegions[r][c]];
            cell.onclick = () => {
                boardState[r][c] = (boardState[r][c] + 1) % 3;
                render();
            };
            grid.appendChild(cell);
        }
    }
    startTimer();
    render();
}

function render() {
    const level = QUEENS_LEVELS[currentLevelIndex];
    const queens = [];
    for (let r = 0; r < 7; r++) {
        for (let c = 0; c < 7; c++) {
            if (boardState[r][c] === 2) queens.push({r, c, reg: level.colorRegions[r][c]});
        }
    }

    const conflicts = new Set();
    queens.forEach(q1 => {
        queens.forEach(q2 => {
            if (q1 === q2) return;
            if (q1.r === q2.r || q1.c === q2.c || q1.reg === q2.reg || (Math.abs(q1.r-q2.r)<=1 && Math.abs(q1.c-q2.c)<=1)) {
                conflicts.add(`${q1.r}-${q1.c}`);
            }
        });
    });

    for (let r = 0; r < 7; r++) {
        for (let c = 0; c < 7; c++) {
            const cell = document.getElementById(`cell-${r}-${c}`);
            cell.innerHTML = boardState[r][c] === 1 ? '<span class="cross">✕</span>' : (boardState[r][c] === 2 ? '<span class="queen">♛</span>' : '');
            cell.classList.toggle('error', boardState[r][c] === 2 && conflicts.has(`${r}-${c}`));
        }
    }

    if (queens.length === 7 && conflicts.size === 0) {
        clearInterval(timerInterval);
        const timeStr = document.getElementById('timer').innerText;
        const curSecs = (parseInt(timeStr.split(':')[0]) * 60) + parseInt(timeStr.split(':')[1]);
        const scores = JSON.parse(localStorage.getItem('q_best_7x7') || '{}');
        let msg = `Gefeliciteerd! Tijd: ${timeStr}`;
        if (!scores[level.id] || curSecs < scores[level.id]) {
            msg += "\nNieuw record!";
            scores[level.id] = curSecs;
            localStorage.setItem('q_best_7x7', JSON.stringify(scores));
        }
        setTimeout(() => { alert(msg); loadLevel(currentLevelIndex); }, 100);
    }
}

function startTimer() {
    startTime = Date.now();
    if (timerInterval) clearInterval(timerInterval);
    timerInterval = setInterval(() => {
        const elapsed = Math.floor((Date.now() - startTime) / 1000);
        document.getElementById('timer').innerText = `${Math.floor(elapsed/60).toString().padStart(2,'0')}:${(elapsed%60).toString().padStart(2,'0')}`;
    }, 1000);
}

function nextLevel() { currentLevelIndex = (currentLevelIndex + 1) % QUEENS_LEVELS.length; loadLevel(currentLevelIndex); }
function resetLevel() { loadLevel(currentLevelIndex); }

window.onload = init;
</script>
</body>
</html>
