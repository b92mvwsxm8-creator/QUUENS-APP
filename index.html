<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Queens</title>
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#111111">
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header>
    <h1>Queens</h1>
    <div class="row">
      <label for="puzzleSelect">Puzzel</label>
      <select id="puzzleSelect"></select>
      <button id="resetBtn" type="button">Reset</button>
    </div>
    <p id="status" aria-live="polite"></p>
  </header>

  <main>
    <div id="board" class="board" role="grid" aria-label="Queens bord"></div>
    <section class="rules">
      <h2>Regels</h2>
      <p>Plaats exact één koningin in elke rij, elke kolom en elke regio. Koninginnen mogen elkaar niet raken, ook niet diagonaal.</p>
    </section>
  </main>

  <script src="puzzles.js"></script>
  <script src="app.js"></script>
</body>
</html>
