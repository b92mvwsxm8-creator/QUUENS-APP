<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Queens Expert</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header style="text-align: center; margin-top: 10px;">
        <h1 style="margin: 0;">Queens Expert</h1>
        <div style="font-weight: bold; color: #d32f2f; margin-top: 5px;">
            <span id="puzzle-name">Laden...</span>
        </div>
    </header>

    <div class="controls">
        <select id="gridSize" onchange="initGame()">
            <option value="7">7x7</option>
            <option value="8">8x8</option>
            <option value="10" selected>10x10</option>
        </select>
        <button onclick="initGame()">Nieuwe Puzzel</button>
        <div class="timer-box">Tijd: <span id="timer">00:00</span></div>
    </div>

    <div id="board-container"><div id="board"></div></div>

    <script src="puzzles.js"></script>
    <script src="app.js"></script>
</body>
</html>
